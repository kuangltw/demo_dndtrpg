<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="880" viewBox="0 0 1440 880" role="img" aria-labelledby="title desc">
<title id="title">DNDTRPG 系統架構</title><desc id="desc">瀏覽器經由 Nginx 連接 Vue 前端與 Laravel API，後端使用 MySQL、Redis、Queue、Reverb。</desc>
<defs><linearGradient id="bg" x2="0" y2="1"><stop stop-color="#101827"/><stop offset="1" stop-color="#0b1220"/></linearGradient><linearGradient id="card" x2="1" y2="1"><stop stop-color="#1c2b3d"/><stop offset="1" stop-color="#142235"/></linearGradient><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12z" fill="#65d6c2"/></marker><style>text{font-family:Inter,'Noto Sans TC',sans-serif;fill:#e9f2f8}.muted{fill:#a9bdc9}.label{font-size:19px;fill:#65d6c2;letter-spacing:2px}.title{font-size:44px;font-weight:700}.boxTitle{font-size:28px;font-weight:700}.desc{font-size:18px}.small{font-size:16px}.line{stroke:#65d6c2;stroke-width:3;fill:none;marker-end:url(#arrow)}.dash{stroke:#8ba5b7;stroke-width:2;stroke-dasharray:8 8;fill:none}</style></defs>
<rect width="1440" height="880" fill="url(#bg)"/><circle cx="1290" cy="80" r="190" fill="#153b45" opacity=".25"/><circle cx="100" cy="790" r="220" fill="#30254c" opacity=".2"/>
<text x="90" y="88" class="label">DNDTRPG / SYSTEM OVERVIEW</text><text x="90" y="145" class="title">系統架構</text><text x="90" y="182" class="desc muted">前端提交玩家選擇；後端負責規則判定、資料保存與事件同步。</text>
<rect x="90" y="250" width="270" height="150" rx="18" fill="url(#card)" stroke="#426174"/><text x="125" y="302" class="boxTitle">玩家瀏覽器</text><text x="125" y="342" class="desc muted">Vue 3 · Vite · Pinia</text><text x="125" y="372" class="small muted">vue-i18n（繁中／英文預留）</text>
<rect x="440" y="250" width="245" height="150" rx="18" fill="url(#card)" stroke="#426174"/><text x="475" y="302" class="boxTitle">Nginx</text><text x="475" y="342" class="desc muted">反向代理</text><text x="475" y="372" class="small muted">HTTP / API 路由</text>
<rect x="765" y="220" width="300" height="210" rx="18" fill="url(#card)" stroke="#65d6c2" stroke-width="2"/><text x="805" y="275" class="boxTitle">Laravel 11 API</text><text x="805" y="315" class="desc muted">Request → UseCase → Service</text><text x="805" y="347" class="desc muted">→ Repository → Model</text><text x="805" y="389" class="small muted">規則判定 · 權限 · 稽核紀錄</text>
<rect x="1150" y="230" width="220" height="115" rx="18" fill="url(#card)" stroke="#426174"/><text x="1180" y="278" class="boxTitle">MySQL 8</text><text x="1180" y="314" class="small muted">主要資料與遊戲紀錄</text>
<rect x="1150" y="400" width="220" height="125" rx="18" fill="url(#card)" stroke="#426174"/><text x="1180" y="448" class="boxTitle">Redis</text><text x="1180" y="484" class="small muted">Cache · Queue</text>
<rect x="780" y="545" width="280" height="125" rx="18" fill="url(#card)" stroke="#426174"/><text x="820" y="593" class="boxTitle">Queue Worker</text><text x="820" y="629" class="small muted">逾時處理 · 背景工作</text>
<rect x="440" y="545" width="245" height="125" rx="18" fill="url(#card)" stroke="#426174"/><text x="478" y="593" class="boxTitle">Reverb</text><text x="478" y="629" class="small muted">WebSocket 即時事件</text>
<rect x="90" y="545" width="270" height="125" rx="18" fill="url(#card)" stroke="#426174"/><text x="125" y="593" class="boxTitle">Laravel Echo</text><text x="125" y="629" class="small muted">前端訂閱狀態通知</text>
<path d="M360 325H430" class="line"/><path d="M685 325H755" class="line"/><path d="M1065 285H1140" class="line"/><path d="M1065 355C1115 355 1105 455 1140 455" class="line"/><path d="M905 430V535" class="line"/><path d="M780 607H695" class="line"/><path d="M440 607H370" class="line"/><path d="M560 545C560 475 910 495 910 440" class="dash"/>
<text x="386" y="302" class="small muted">HTTP</text><text x="700" y="302" class="small muted">API</text><text x="1080" y="270" class="small muted">SQL</text><text x="1075" y="418" class="small muted">Cache / Queue</text><text x="90" y="752" class="label">DESIGN PRINCIPLE</text><text x="90" y="793" class="desc">API 是遊戲狀態來源；WebSocket 傳遞同步事件，不負責裁定戰鬥規則。</text><text x="90" y="840" class="small muted">Docker Compose 開發服務：nginx · frontend-web · backend-api · mysql · redis · reverb</text>
</svg>